version: 2

sources:
  - name: google
    database: DB30_BRONZE_DB
    schema: GOOGLE
    config: 
      freshness: 
        warn_after: {count: 100, period: day}
        error_after: {count: 365, period: day}
      loaded_at_field: loaded_at
        
        
    tables:
      - name: budget
        columns:
          - name: _ROW
          - name: QUANTITY
          - name: MONTH
          - name: PRODUCT_ID
          - name: _FIVETRAN_SYNCED

      - name: user
        columns:
          - name: NOMBRE
          - name: DNI
          - name: EMAIL
          - name: FECHA_ALTA_SISTEMA
          